<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            padding: 20px;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 500px;
        }
        .title {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff, 0 0 60px #00d4ff;
            letter-spacing: 8px;
            animation: titleGlow 2s ease-in-out infinite alternate;
        }
        @keyframes titleGlow {
            from {
                text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff, 0 0 60px #00d4ff;
            }
            to {
                text-shadow: 0 0 30px #ff00ff, 0 0 60px #ff00ff, 0 0 90px #ff00ff;
            }
        }
        .score-display {
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 0 10px #00ff88;
            background: rgba(0, 255, 136, 0.1);
            padding: 10px 30px;
            border-radius: 25px;
            border: 2px solid #00ff88;
        }
        .level-display {
            font-size: 1.2rem;
            color: #fff;
            text-shadow: 0 0 10px #ffaa00;
            background: rgba(255, 170, 0, 0.1);
            padding: 8px 25px;
            border-radius: 20px;
            border: 2px solid #ffaa00;
        }
        .simon-board {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, #2a2a4a 0%, #1a1a2e 100%);
            box-shadow: 
                0 0 30px rgba(0, 212, 255, 0.5),
                0 0 60px rgba(0, 212, 255, 0.3),
                inset 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .color-btn {
            position: absolute;
            width: 160px;
            height: 160px;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            opacity: 0.6;
        }
        .color-btn:hover {
            opacity: 0.8;
        }
        .color-btn.active {
            opacity: 1;
        }
        .color-btn:disabled {
            cursor: not-allowed;
            opacity: 0.4;
        }
        .green {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            top: 0;
            left: 0;
            border-radius: 50% 0 0 0;
            box-shadow: 0 0 20px #00ff88, inset 0 0 15px rgba(255,255,255,0.3);
        }
        .green.active {
            box-shadow: 0 0 50px #00ff88, 0 0 80px #00ff88, inset 0 0 25px rgba(255,255,255,0.5);
        }
        .yellow {
            background: linear-gradient(135deg, #ffdd00 0%, #ccaa00 100%);
            top: 0;
            right: 0;
            border-radius: 0 50% 0 0;
            box-shadow: 0 0 20px #ffdd00, inset 0 0 15px rgba(255,255,255,0.3);
        }
        .yellow.active {
            box-shadow: 0 0 50px #ffdd00, 0 0 80px #ffdd00, inset 0 0 25px rgba(255,255,255,0.5);
        }
        .red {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            bottom: 0;
            left: 0;
            border-radius: 0 0 0 50%;
            box-shadow: 0 0 20px #ff4444, inset 0 0 15px rgba(255,255,255,0.3);
        }
        .red.active {
            box-shadow: 0 0 50px #ff4444, 0 0 80px #ff4444, inset 0 0 25px rgba(255,255,255,0.5);
        }
        .blue {
            background: linear-gradient(135deg, #4488ff 0%, #0044cc 100%);
            bottom: 0;
            right: 0;
            border-radius: 0 0 50% 0;
            box-shadow: 0 0 20px #4488ff, inset 0 0 15px rgba(255,255,255,0.3);
        }
        .blue.active {
            box-shadow: 0 0 50px #4488ff, 0 0 80px #4488ff, inset 0 0 25px rgba(255,255,255,0.5);
        }
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #3a3a5a 0%, #1a1a2e 100%);
            border-radius: 50%;
            box-shadow: 
                0 0 20px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .center-text {
            font-size: 0.9rem;
            color: #888;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .start-btn {
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #00d4ff 0%, #0066ff 100%);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff, inset 0 0 10px rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #00d4ff, 0 0 60px #00d4ff, inset 0 0 15px rgba(255,255,255,0.3);
        }
        .start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal {
            background: linear-gradient(135deg, #2a2a4a 0%, #1a1a2e 100%);
            padding: 40px 60px;
            border-radius: 30px;
            text-align: center;
            border: 3px solid #ff4444;
            box-shadow: 
                0 0 50px rgba(255, 68, 68, 0.5),
                0 0 100px rgba(255, 68, 68, 0.3);
            animation: modalPop 0.5s ease;
            max-width: 90%;
        }
        @keyframes modalPop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal h2 {
            font-size: 2.5rem;
            color: #ff4444;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff4444, 0 0 40px #ff4444;
        }
        .modal-score {
            font-size: 4rem;
            color: #fff;
            margin: 20px 0;
            text-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88;
        }
        .modal-text {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
        }
        .restart-btn {
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88, inset 0 0 10px rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }
        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #00ff88, 0 0 60px #00ff88, inset 0 0 15px rgba(255,255,255,0.3);
        }
        /* Responsive Design */
        @media (max-width: 500px) {
            .title {
                font-size: 2rem;
            }
            .simon-board {
                width: 280px;
                height: 280px;
            }
            .color-btn {
                width: 140px;
                height: 140px;
            }
            .center-circle {
                width: 80px;
                height: 80px;
            }
            .center-text {
                font-size: 0.7rem;
            }
            .score-display {
                font-size: 1.2rem;
            }
            .modal h2 {
                font-size: 2rem;
            }
            .modal-score {
                font-size: 3rem;
            }
        }
        @media (max-width: 350px) {
            .simon-board {
                width: 250px;
                height: 250px;
            }
            .color-btn {
                width: 125px;
                height: 125px;
            }
            .center-circle {
                width: 70px;
                height: 70px;
            }
            .title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">SIMON</h1>
        
        <div class="score-display">
            Score: <span id="score">0</span>
        </div>
        <div class="level-display">
            Level: <span id="level">0</span>
        </div>
        <div class="simon-board">
            <button class="color-btn green" data-color="green" aria-label="Green button"></button>
            <button class="color-btn yellow" data-color="yellow" aria-label="Yellow button"></button>
            <button class="color-btn red" data-color="red" aria-label="Red button"></button>
            <button class="color-btn blue" data-color="blue" aria-label="Blue button"></button>
            
            <div class="center-circle">
                <span class="center-text" id="center-text">Ready?</span>
            </div>
        </div>
        <button class="start-btn" id="start-btn">Start Game</button>
    </div>
    <!-- Game Over Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2>GAME OVER!</h2>
            <div class="modal-text">Your Final Score</div>
            <div class="modal-score" id="final-score">0</div>
            <div class="modal-text" id="level-reached">You reached Level 0</div>
            <button class="restart-btn" id="restart-btn">Play Again</button>
        </div>
    </div>
    <script>
        $(document).ready(function() {
            // Game variables
            let gameSequence = [];
            let playerSequence = [];
            let level = 0;
            let score = 0;
            let isGameActive = false;
            let isComputerTurn = false;
            
            const colors = ['green', 'yellow', 'red', 'blue'];
            const colorMap = {
                'green': 140,
                'yellow': 160,
                'red': 180,
                'blue': 200
            };
            // Sound frequencies for each color
            const soundFrequencies = {
                'green': 329.63,
                'yellow': 392.00,
                'red': 261.63,
                'blue': 349.23
            };
            // Audio context for sounds
            let audioContext = null;
            function initAudio() {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            function playSound(color) {
                if (!audioContext) return;
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = soundFrequencies[color];
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            }
            function flashButton(color) {
                const $button = $(`.color-btn.${color}`);
                $button.addClass('active');
                playSound(color);
                
                setTimeout(function() {
                    $button.removeClass('active');
                }, 350);
            }
            function nextSequence() {
                level++;
                score = level - 1;
                $('#level').text(level);
                $('#score').text(score);
                $('#center-text').text('Watch!');
                
                // Add new random color to sequence
                const randomColor = colors[Math.floor(Math.random() * 4)];
                gameSequence.push(randomColor);
                
                // Play the sequence
                isComputerTurn = true;
                playerSequence = [];
                
                let i = 0;
                const interval = setInterval(function() {
                    if (i < gameSequence.length) {
                        flashButton(gameSequence[i]);
                        i++;
                    } else {
                        clearInterval(interval);
                        isComputerTurn = false;
                        $('#center-text').text('Your Turn!');
                    }
                }, 600);
            }
            function handleColorClick(color) {
                if (!isGameActive || isComputerTurn) return;
                
                flashButton(color);
                playerSequence.push(color);
                
                // Check if the clicked color matches the current position in sequence
                const currentIndex = playerSequence.length - 1;
                
                if (playerSequence[currentIndex] !== gameSequence[currentIndex]) {
                    gameOver();
                    return;
                }
                
                // Check if player completed the entire sequence
                if (playerSequence.length === gameSequence.length) {
                    score = level;
                    $('#score').text(score);
                    isComputerTurn = true;
                    $('#center-text').text('Great!');
                    
                    setTimeout(function() {
                        nextSequence();
                    }, 1000);
                }
            }
            function gameOver() {
                isGameActive = false;
                $('#center-text').text('Game Over!');
                
                // Show modal
                $('#final-score').text(score);
                $('#level-reached').text('You reached Level ' + level);
                $('#modal-overlay').fadeIn(300);
                
                // Play error sound
                if (audioContext) {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    oscillator.frequency.value = 150;
                    oscillator.type = 'sawtooth';
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.6);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.6);
                }
            }
            function startGame() {
                initAudio();
                
                // Reset game state
                gameSequence = [];
                playerSequence = [];
                level = 0;
                score = 0;
                isGameActive = true;
                isComputerTurn = false;
                
                $('#level').text('0');
                $('#score').text('0');
                $('#start-btn').prop('disabled', true);
                
                // Start first sequence
                setTimeout(function() {
                    nextSequence();
                }, 500);
            }
            function restartGame() {
                $('#modal-overlay').fadeOut(300);
                $('#start-btn').prop('disabled', false);
                $('#center-text').text('Ready?');
            }
            // Event listeners
            $('#start-btn').on('click', function() {
                startGame();
            });
            $('#restart-btn').on('click', function() {
                restartGame();
            });
            $('.color-btn').on('click', function() {
                const color = $(this).data('color');
                handleColorClick(color);
            });
            // Prevent double-tap zoom on mobile
            $('.color-btn').on('touchstart', function(e) {
                e.preventDefault();
                $(this).trigger('click');
            });
        });
    </script>
</body>
</html>
